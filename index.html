<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      C-2: 通信の機械的禁止。scripts/verify-artifact.mjs がビルド成果物の CSP を照合し、
      差異があればビルドを落とす。connect-src 'none' は絶対に緩めない
      （顧客の情シスに提示する検証可能な証拠であるため）。

      worker-src blob: は引き継ぎ書 §2 C-2 の原文に対する唯一の追加（2026-08-09 開発者承認）。
      CSP3 の Worker 取得は worker-src → child-src → script-src → default-src とフォールバックし、
      原文には前2つが無いため script-src 'unsafe-inline' に落ちる。'unsafe-inline' は blob: を
      許可しないため、§4.3 が必須とする Blob URL 製 Worker が起動できなかった（Chrome 151 で実測）。
      この1行が許すのは「自分で生成したメモリ上のコードをワーカーとして起動すること」だけで、
      ネットワークアクセスは一切増えない。詳細は docs/plan-phase1.md の R-B。
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
               script-src 'unsafe-inline';
               worker-src blob:;
               style-src 'unsafe-inline';
               img-src data:;
               font-src data:;
               connect-src 'none';
               form-action 'none';
               base-uri 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>業務ファイル健診 — Excelブック（.xlsx / .xlsm）の診断</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
